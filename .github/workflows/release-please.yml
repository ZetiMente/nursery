# release-please keeps one release PR open on main. Merging that PR IS the
# release (version bump, tag, changelog), and only a maintainer merges it. Nothing deploys
# from here.
name: release-please

on:
  push:
    branches: [main]
    # Docs-only merges never change the version, so they skip the run. A release PR
    # merge always touches the manifest, so it always runs and always tags.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Never cancel a run that may be creating a tag.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
